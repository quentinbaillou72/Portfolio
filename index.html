<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Quentin Baillou | BTS SIO SISR</title>
    <!-- Police Google Fonts moderne (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icônes FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- STYLES GÉNÉRAUX & RESET --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
        }

        /* --- BARRE DE NAVIGATION --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .logo {
            font-size: 1.2rem;
            color: #38bdf8;
            font-weight: 700;
        }

        nav {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: #38bdf8;
        }

        .btn-nav {
            background: #38bdf8;
            color: #0f172a !important;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
        }

        .btn-nav:hover {
            background: #0ea5e9;
        }

        /* --- SECTIONS COMMUNES --- */
        section {
            min-height: 100vh;
            padding: 140px 8% 80px 8%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .section-title {
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .section-title span {
            color: #38bdf8;
        }

        .section-subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        /* --- 1. ACCUEIL (HERO) --- */
        #accueil {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
        }

        .hero-content {
            flex: 1;
        }

        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .highlight {
            color: #38bdf8;
        }

        .hero p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 30px;
            max-width: 600px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn.primary {
            background: #38bdf8;
            color: #0f172a;
        }

        .btn.primary:hover {
            background: #0ea5e9;
            transform: translateY(-2px);
        }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn.secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .social-icons {
            display: flex;
            gap: 15px;
        }

        .social-icons a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .social-icons a:hover {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }

        .hero-card {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-box {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 25px;
            border-radius: 12px;
            transition: transform 0.3s, border-color 0.3s;
        }

        .card-box:hover {
            transform: translateY(-5px);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .tech-icon {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 15px;
        }

        .card-box h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .card-box p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin: 0;
        }

        /* --- 2. PROJETS & COMPÉTENCES --- */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .project-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 30px;
            transition: transform 0.3s;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .project-card h3 {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: #f8fafc;
        }

        .project-card p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tag {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* --- 3. ALTERNANCE & PARCOURS --- */
        .alternance-box {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .alternance-box h3 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: #38bdf8;
        }

        .alternance-box h4 {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .alternance-box ul {
            margin-top: 15px;
            padding-left: 20px;
            color: #94a3b
