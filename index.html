<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Quentin Baillou | BTS SIO SISR</title>
    <!-- Favicone Planète en SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z'/></svg>">
    <!-- Police Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Icônes FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- STYLE DARK SPATIAL ULTIMATE & INTERACTIF --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #030712;
            color: #f3f4f6;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* --- FOND SPATIAL AVEC PLANÈTES EN MOUVEMENT ET MÉTÉORITES --- */
        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: #030712;
            overflow: hidden;
        }

        /* 1. Planète Bleue (Géante) avec vraie animation de déplacement */
        .planet-blue {
            position: absolute;
            bottom: -150px;
            right: -100px;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle at 30% 30%, #38bdf8, #0284c7 40%, #030712 85%);
            border-radius: 50%;
            box-shadow: inset -40px -40px 90px rgba(0, 0, 0, 0.9), 0 0 60px rgba(56, 189, 248, 0.25);
            opacity: 0.65;
            animation: moveBluePlanet 25s ease-in-out infinite alternate;
        }

        @keyframes moveBluePlanet {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(-40px, -30px) scale(1.05) rotate(5deg); }
            100% { transform: translate(-20px, 20px) scale(0.98) rotate(-5deg); }
        }

        /* 2. Planète Rouge / Cuivrée (Type Mars) en mouvement */
        .planet-red {
            position: absolute;
            top: 20%;
            left: 5%;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle at 35% 35%, #f97316, #c2410c 50%, #030712 90%);
            border-radius: 50%;
            box-shadow: inset -25px -25px 50px rgba(0, 0, 0, 0.85), 0 0 40px rgba(249, 115, 22, 0.3);
            opacity: 0.55;
            animation: moveRedPlanet 30s ease-in-out infinite alternate;
        }

        @keyframes moveRedPlanet {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, 40px) scale(1.1); }
            100% { transform: translate(20px, -30px) scale(0.95); }
        }

        /* 3. Petite Planète Violette / Néon en mouvement rapide */
        .planet-purple {
            position: absolute;
            top: 60%;
            left: 15%;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #c084fc, #7c3aed 60%, #030712 90%);
            border-radius: 50%;
            box-shadow: inset -15px -15px 30px rgba(0, 0, 0, 0.8), 0 0 25px rgba(192, 132, 252, 0.4);
            opacity: 0.5;
            animation: movePurplePlanet 18s ease-in-out infinite alternate;
        }

        @keyframes movePurplePlanet {
            0% { transform: translate(0, 0) scale(0.9); }
            100% { transform: translate(-50px, -60px) scale(1.15); }
        }

        /* Grille perspective spatiale */
        .cyber-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 30s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        /* Météorites / Étoiles filantes traversant l'espace */
        .meteor {
            position: absolute;
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,1), transparent);
            transform: rotate(-45deg);
            opacity: 0;
            animation: shootMeteor 6s linear infinite;
            pointer-events: none;
        }

        .meteor-1 { top: 10%; left: -10%; animation-delay: 1s; }
        .meteor-2 { top: 40%; left: -10%; animation-delay: 3.5s; animation-duration: 5s; }

        @keyframes shootMeteor {
            0% { transform: translate(0, 0) rotate(-45deg); opacity: 1; }
            30% { transform: translate(50vw, 50vh) rotate(-45deg); opacity: 0; }
            100% { transform: translate(50vw, 50vh) rotate(-45deg); opacity: 0; }
        }

        /* Nébuleuses d'ambiance */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            animation: floatOrb 15s ease-in-out infinite alternate;
        }

        .orb-1 { top: 10%; left: 30%; width: 500px; height: 500px; background: #0284c7; }
        .orb-2 { top: 40%; left: 70%; width: 450px; height: 450px; background: #7c3aed; animation-delay: -5s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -40px) scale(1.12); }
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 80px 80px;
            opacity: 0.25;
            animation: twinkle 5s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.15; }
            100% { opacity: 0.35; }
        }

        /* --- VAISSEAUX SPATIAUX EN VOL --- */
        .plane-container {
            position: fixed;
            top: 0;
            left: -150px;
            width: 100px;
            height: 50px;
            z-index: 998;
            pointer-events: none;
            animation: flyAcross 8s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }

        .plane-container.ship-2 {
            animation: flyAcross2 12s cubic-bezier(0.25, 1, 0.5, 1) infinite;
            animation-delay: -4s;
        }

        .plane-icon {
            font-size: 2.2rem;
            color: #38bdf8;
            transform: rotate(45deg);
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.9));
        }

        .plane-trail {
            position: absolute;
            top: 15px;
            right: 25px;
            width: 140px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.9));
        }

        @keyframes flyAcross {
            0% { transform: translate(-100px, 150px) rotate(-10deg); opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translate(110vw, -100px) rotate(-15deg); opacity: 0; }
        }

        @keyframes flyAcross2 {
            0% { transform: translate(110vw, 400px) rotate(-35deg); opacity: 0; }
            15% { opacity: 0.7; }
            85% { opacity: 0.7; }
            100% { transform: translate(-100px, 100px) rotate(-25deg); opacity: 0; }
        }

        /* --- LUMIÈRE SUIVEUSE DE CURSEUR --- */
        #cursor-light {
            position: fixed;
            top: 0;
            left: 0;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.14) 0%, rgba(37, 99, 235, 0.03) 40%, transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: -1;
            transition: width 0.2s, height 0.2s;
        }

        /* --- BARRE DE PROGRESSION --- */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            width: 0%;
            z-index: 9999;
            box-shadow: 0 0 12px #38bdf8;
        }

        /* --- BOUTON RETOUR EN HAUT --- */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 45px;
            height: 45px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            text-decoration: none;
        }

        .back-to-top.show {
            opacity: 1;
            visibility: visible;
        }

        .back-to-top:hover {
            background: #38bdf8;
            color: #030712;
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
        }

        /* --- BARRE DE NAVIGATION FLOTTANTE --- */
        header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 30px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.3);
            z-index: 1000;
        }

        .logo {
            font-size: 1.2rem;
            color: #38bdf8;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }

        nav {
            display: flex;
            gap: 22px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        nav a:hover, nav a.active {
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
            transform: translateY(-2px);
        }

        .badge-linkdn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white !important;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.5);
            transition: all 0.3s ease;
        }

        .badge-linkdn:hover {
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.9);
        }

        /* --- SECTIONS GÉNÉRALES --- */
        section {
            min-height: 100vh;
            padding: 140px 8% 80px 8%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .section-title span {
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-subtitle {
            color: #94a3b8;
            margin-bottom: 50px;
            font-size: 1.05rem;
            text-align: center;
        }

        /* --- 1. ACCUEIL (HERO) --- */
        #accueil {
            text-align: center;
            align-items: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 6px 16px;
            border-radius: 20px;
            color: #38bdf8;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
            animation: pulse 2s infinite;
        }

        .hero-title-main {
            font-size: 3.5rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .hero-subtitle-main {
            font-size: 1.2rem;
            background: linear-gradient(135deg, #38bdf8, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hero-desc {
            color: #94a3b8;
            font-size: 1.15rem;
            max-width: 750px;
            margin: 0 auto 35px auto;
            line-height: 1.7;
            transition: color 0.3s ease;
        }

        .hero-desc:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .hero-btns {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            border: 1px solid rgba(56, 189, 248, 0.6);
        }

        .btn-primary:hover {
            transform: translateY(-5px) scale(1.04);
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.9);
        }

        .btn-secondary {
            background: rgba(15, 23, 42, 0.8);
            color: #f3f4f6;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            transform: translateY(-5px) scale(1.04);
            border-color: #38bdf8;
            color: #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
        }

        /* --- BLOCS DE TEXTE ULTRA INTERACTIFS (EFFET 3D AU HOVER) --- */
        .skills-grid, .projects-grid, .timeline-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 20px;
            perspective: 1000px;
        }

        .skill-card, .project-card, .timeline-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s ease, background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .skill-card:hover, .project-card:hover, .timeline-card:hover {
            transform: translateY(-10px) scale(1.03) rotateX(3deg) rotateY(-3deg);
            background: rgba(30, 41, 59, 0.9);
            border-color: #38bdf8;
            box-shadow: 0 15px 50px rgba(56, 189, 248, 0.4), inset 0 0 25px rgba(56, 189, 248, 0.2);
        }

        .skill-card:hover p, .project
